[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governgrid-reviewer-guard"
version = "0.1.0"
description = "Provider-neutral reviewer independence guard for exact software targets"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.scripts]
reviewer-guard = "reviewer_guard:main"

[tool.setuptools]
py-modules = ["reviewer_guard"]
license-files = ["LICENSE"]
